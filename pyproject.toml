[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arwn"
version = "3.0.0"
description = "Collect 433Mhz weather sensor data and publish to mqtt"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    {name = "Sean Dague", email = "sean@dague.net"}
]
keywords = ["arwn", "weather", "sensor", "mqtt", "433mhz"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pyyaml>=5.1",
    "python-daemon",
    "paho-mqtt>=1.1",
    "pyserial>=3",
    "pid>=2",
    "watchdog>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.0",
    "ruff>=0.4",
    "mypy>=1.0",
]
docs = [
    "sphinx>=6.0",
    "sphinx-rtd-theme>=1.0",
]

[project.urls]
Homepage = "https://github.com/sdague/arwn"
Repository = "https://github.com/sdague/arwn"
Issues = "https://github.com/sdague/arwn/issues"

[project.scripts]
arwn-collect = "arwn.cmd.collect:main"
arwn-install-service = "arwn.cmd.install_service:main"

[tool.hatch.build.targets.wheel]
packages = ["arwn"]
include = [
    "arwn/**/*.py",
    "arwn/data/*.template",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "-p", "no:homeassistant",
]

[tool.coverage.run]
source = ["arwn"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["arwn/vendor"]

[tool.ruff.lint]
select = ["E", "W", "F", "I"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "serial.*",
    "daemon.*",
    "pid.*",
]
ignore_missing_imports = true